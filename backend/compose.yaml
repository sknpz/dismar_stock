# PostgreSQL local para desenvolvimento: docker compose up -d
# API em container, com a mesma imagem do deploy: docker compose --profile api up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dismar
      POSTGRES_USER: dismar
      POSTGRES_PASSWORD: dismar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dismar -d dismar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: [api]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dismar
      DB_USERNAME: dismar
      DB_PASSWORD: dismar
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
