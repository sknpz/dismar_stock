spring.application.name=tana-stock-api

# PORT também é a variável usada por serviços de deploy como Render e Railway
server.port=${PORT:8080}

# Banco de dados: valores padrão apontam para o PostgreSQL do compose.yaml.
# Em produção (Supabase), defina DB_URL, DB_USERNAME e DB_PASSWORD como variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tana}
spring.datasource.username=${DB_USERNAME:tana}
spring.datasource.password=${DB_PASSWORD:tana}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

springdoc.swagger-ui.path=/swagger-ui.html

# Health check usado pelo Render. Só o /actuator/health fica exposto, sem detalhes.
# /actuator/health/liveness responde se a aplicação está de pé, sem depender do banco.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://sknpz.github.io}
app.zone-id=America/Sao_Paulo

# Autenticação (JWT). Sem JWT_SECRET, a API gera uma chave aleatória a cada inicialização:
# serve para desenvolvimento, mas em produção todos teriam que fazer login de novo após cada deploy.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:8h}

# Primeiro administrador: criado na inicialização somente se ainda não existir nenhum usuário
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
